name: Build WDA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          path: wda

      - name: Build WebDriverAgentRunner (unsigned)
        working-directory: wda
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          ls -la build/Build/Products/Release-iphoneos/

      - name: Package IPA with entitlements
        working-directory: wda
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          test -d "$APP"
          rm -rf Payload WebDriverAgent.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          EOF

          find Payload -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign -f -s - --entitlements ent.plist "$f" || true
            fi
          done
          find Payload -name "*.xctest" -maxdepth 3 -print0 | while IFS= read -r -d '' b; do
            codesign -f -s - --entitlements ent.plist "$b" || true
          done
          codesign -f -s - --entitlements ent.plist Payload/WebDriverAgentRunner-Runner.app || true

          zip -qry WebDriverAgent.ipa Payload
          unzip -l WebDriverAgent.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: wda/WebDriverAgent.ipa
          if-no-files-found: error
